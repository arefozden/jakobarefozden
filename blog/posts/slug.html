<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Personal portfolio, projects and writing."><title>Article · Jakob Aref Øzden</title><link rel="stylesheet" href="../../assets/css/site.css"><script defer src="../../assets/js/site.js"></script><link rel="icon" type="image/png" href="../../favicon.png"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../../">Jakob Aref <i>Øzden.</i></a><nav class="nav-links" aria-label="Main navigation"><a class="" href="../../">Home</a><a class="" href="../../about/">About</a><a class="" href="../../projects/">Projects</a><a class="" href="../../skills/">Skills</a><a href="../../learning/">Learning</a><a class="" href="../../blog/">Blog</a><a class="" href="../../contact/">Contact</a><a class="" href="../../cv/">CV</a></nav><button class="theme-btn" type="button" data-theme-toggle aria-label="Toggle color theme">◐ Theme</button></div></header><main class="container page"><a class="link" href="../../blog/">← Back to blog</a><h1 class="page-title" id="article-title">Article</h1><div class="meta" id="article-meta"></div><article class="card" id="article-body" style="margin-top:25px;max-width:850px;white-space:pre-wrap">Loading…</article></main><script> (async()=>{const params=new URLSearchParams(location.search),slug=params.get('slug');try{const res=await fetch('../blog-manifest.json');const data=await res.json();const p=data.posts.find(x=>x.slug===slug);if(!p)throw Error('Article not found');document.getElementById('article-title').textContent=p.title;document.getElementById('article-meta').textContent=p.date+' · '+p.category;const url=p.path||p.file||p.url;if(!url){document.getElementById('article-body').textContent=p.excerpt||'No content available';return}const r=await fetch(new URL('../../'+url.replace(/^\//,''),location.href));if(!r.ok)throw Error('Content unavailable');document.getElementById('article-body').textContent=await r.text()}catch(e){document.getElementById('article-body').textContent='Article could not be loaded.'}})();</script><footer class="footer"><div class="container footer-inner"><span>© <span id="year"></span> Jakob Aref Øzden · Built with HTML, CSS & JavaScript</span><span><a href="https://github.com/arefozden" target="_blank" rel="noopener noreferrer">GitHub</a><a href="https://www.linkedin.com/in/aref-ozden" target="_blank" rel="noopener noreferrer">LinkedIn</a></span></div></footer><script>document.getElementById('year').textContent=new Date().getFullYear()</script></body></html>
