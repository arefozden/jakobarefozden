
<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min oppgaveliste</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Min oppgaveliste</h1>
        <p>Hold oversikt over oppgavene dine!</p>

        <div class="skjema">
            <input type="text" id="oppgave"
                   placeholder="Skriv en oppgave">

            <button type="button" id="leggTil">
                Legg til
            </button>
        </div>

        <p id="status"></p>

        <h2>Mine oppgaver</h2>
        <ul id="liste"></ul>
    </main>

</body>
</html>
