<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min handleliste</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <h2>Varer</h2>
        <ul id="vareliste"></ul>

        <p id="antall"></p>
    </main>

</body>

</html>
